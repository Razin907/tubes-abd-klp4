# File ini KHUSUS digunakan oleh laptop worker.
# Worker TIDAK menjalankan komponen utama. Database (Postgres) & Antrean (Redis) berada di Cloud. 
# Sedangkan Webserver, Scheduler, dan MinIO berada di laptop master.


services:
  airflow-worker:
    build: .
    command: celery worker
    hostname: ${WORKER_HOSTNAME:-airflow-worker}
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__CELERY__RESULT_BACKEND: ${AIRFLOW__CELERY__RESULT_BACKEND}
      AIRFLOW__CELERY__BROKER_URL: ${AIRFLOW__CELERY__BROKER_URL}
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'true'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
      _PIP_ADDITIONAL_REQUIREMENTS: ''
      MINIO_ENDPOINT: "${MINIO_ENDPOINT}"
      DUMB_INIT_SETSID: "0"
    volumes:
      - ./dags:/opt/airflow/dags
      - worker_logs:/opt/airflow/logs   # Named volume, dikelola Docker (bebas permission error)
      - ./config:/opt/airflow/config
      - ./plugins:/opt/airflow/plugins
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
    user: "${AIRFLOW_UID:-50000}:0"
    restart: always

volumes:
  worker_logs:   # Docker yang mengurus permissionnya, bukan Windows
