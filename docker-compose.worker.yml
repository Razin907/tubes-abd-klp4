# ============================================================
# docker-compose.worker.yml
# File ini KHUSUS digunakan oleh laptop WORKER (teman).
# Jalankan dengan: docker compose -f docker-compose.worker.yml up -d --build
#
# Worker TIDAK menjalankan: postgres, redis, webserver, scheduler,
# airflow-init, atau MinIO. Semua itu sudah ada di laptop Master.
# ============================================================

services:
  airflow-worker:
    build: .
    command: celery worker
    hostname: ${WORKER_HOSTNAME:-airflow-worker}
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__CELERY__RESULT_BACKEND: ${AIRFLOW__CELERY__RESULT_BACKEND}
      AIRFLOW__CELERY__BROKER_URL: ${AIRFLOW__CELERY__BROKER_URL}
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'true'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
      _PIP_ADDITIONAL_REQUIREMENTS: ''
      MINIO_ENDPOINT: "${MINIO_ENDPOINT}"
      DUMB_INIT_SETSID: "0"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./config:/opt/airflow/config
      - ./plugins:/opt/airflow/plugins
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
    user: "${AIRFLOW_UID:-50000}:0"
    restart: always
